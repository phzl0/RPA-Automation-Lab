name: rpa-automation-lab
services:
  erp:
    build:
      context: .
      dockerfile: Dockerfile
    image: rpa-automation-lab:local
    env_file:
      - .env
    environment:
      ERP_DB_PATH: /data/erp.sqlite3
      ERP_URL: http://127.0.0.1:5000
      ERP_HOST: 0.0.0.0
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./storage:/data
      - ./reports:/app/reports
      - ./screenshots:/app/screenshots
    init: true
    shm_size: "512mb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
