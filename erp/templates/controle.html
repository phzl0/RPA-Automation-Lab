<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Controle IA | RPA Lab</title><style>body{font:16px system-ui;background:#0b1210;color:#e5f5ea;max-width:850px;margin:40px auto;padding:15px}a{color:#8be4a5;margin-right:20px}h1{color:#8be4a5}textarea,button,pre{padding:14px;border:1px solid #42654d;border-radius:8px;background:#15221c;color:white}textarea{width:95%;height:90px}button{background:#28613b;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><nav><a href="/">Pedidos</a><a href="/estoque">Estoque</a><a href="/controle">Controle IA</a></nav><h1>Interpretador de comandos — Gemini</h1><p>Esta aba interpreta e valida comandos, mas não os executa. Para executar, use a CLI com confirmação explícita.</p><textarea id="message" placeholder="Cadastre um mouse SKU M-01 com 20 unidades por R$ 50"></textarea><p><button id="interpret">Interpretar comando</button></p><pre id="result">Aguardando comando.</pre><script>document.getElementById('interpret').onclick=async()=>{const result=document.getElementById('result');result.textContent='Interpretando...';try{const r=await fetch('/controle/interpretar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:document.getElementById('message').value})});const data=await r.json();result.textContent=JSON.stringify(data,null,2)+(data.ready?'\n\nPara executar: python -m rpa.cli (repita o comando e confirme no terminal)':'\n\nComplete os campos faltantes e envie novamente.')}catch(e){result.textContent='Falha: '+e.message}};</script></body></html>
